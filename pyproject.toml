[project]
name = "fpl-model"
version = "0.1.0"
description = "Machine-learning decision support for Fantasy Premier League"
readme = "README.md"
authors = [
    { name = "Weshy Joe", email = "josephwaweru96@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "psycopg>=3.3.5",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/fpl_model/dashboard.py" = ["E501"]  # embedded HTML/JS template
